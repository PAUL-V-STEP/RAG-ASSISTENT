# Тестовые вопросы для уровня Q-A (ТЗ-RAG-AL, приложение C и раздел 15.7)
# Формулировки НЕ совпадают с question и paraphrases из qa_base.yaml (проверяется командой qa_tool validate).
#
# Типы тестов:
#   match     — вопрос должен сопоставиться с expected_id (режим direct или hybrid, если не указан expected_mode)
#   contrast  — пары похожих вопросов с разными ответами; каждый должен получить свой expected_id или none,
#               но никогда не чужой id из пары
#   no_match  — ответа в базе Q-A нет; ожидается decision=none (вопрос уходит в RAG)
#   dialog    — вопрос с историей; требует модуль нормализации (contextualization); при выключенной
#               нормализации тест помечается skipped
#
# Для match / contrast / dialog runner дополнительно проверяет, что выданный ответ содержит все facts записи.
#
# accept_ids — записи той же answer_group, ответ которых тоже засчитывается (qa002 ↔ qa003).
#   В отчёте отдельно показывается точное попадание в expected_id (информативно, без порога).
# expected_mode — если задан, режим тоже должен совпасть.
# guard — для no_match: стоп-правило 13.7, которое должно отсечь вопрос (unit_out_of_corpus, level_out_of_corpus);
#   причина в логе Q-A должна совпасть.
# stage — A: нужна только канонизация без LLM (ТЗ-RAG-AL, разделы 10.1 и 11); B: нужна contextualization (10.2–10.6).
#   Тесты stage B при выключенной contextualization получают статус skipped и в метрики этапа A не входят.

schema_version: 2

tests:

